name: Release

# Push a version tag (for example: git tag v1.0.0 && git push origin v1.0.0)
# and this workflow builds ready-to-run executables for Windows, Linux and macOS
# and publishes them on the Releases page.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # Needed to create the release.

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: [win-x64, linux-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test --configuration Release

      # Self-contained: .NET is bundled, so nothing needs to be installed.
      # Single file + trimmed + compressed: one small executable per app.
      - name: Publish
        run: |
          for project in BattleTower Games Fundamentals DataStructures.Demo; do
            dotnet publish "src/$project/$project.csproj" \
              --configuration Release \
              --runtime ${{ matrix.runtime }} \
              --self-contained true \
              -p:PublishSingleFile=true \
              -p:PublishTrimmed=true \
              -p:EnableCompressionInSingleFile=true \
              -p:DebugType=None \
              --output publish
          done
          cp README.md LICENSE publish/

      # Trimming removes code the compiler thinks is unused, so the real executable is run once:
      # it starts a game, saves it, quits, and then continues the saved game. The menus of
      # the other apps are opened and closed too.
      - name: Smoke test the trimmed Battle Tower
        if: matrix.runtime == 'linux-x64'
        working-directory: publish
        run: |
          ls -la
          printf '1\nHero\n1\n5\n0\n0\n' | ./BattleTower > first-run.txt
          test -f battletower-save.json
          printf '2\n0\n0\n' | ./BattleTower > second-run.txt
          grep -q "stands in front of you" second-run.txt
          for app in Games Fundamentals DataStructures.Demo; do printf '0\n' | ./$app > /dev/null; done
          rm -f battletower-save.json first-run.txt second-run.txt

      - name: Package
        run: |
          name="CSharpFundamentals-${{ matrix.runtime }}"
          if [[ "${{ matrix.runtime }}" == win-* ]]; then
            (cd publish && zip -r "../$name.zip" .)
          else
            # tar keeps the executable permission that zip would lose.
            tar -czf "$name.tar.gz" -C publish .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: CSharpFundamentals-${{ matrix.runtime }}
          path: CSharpFundamentals-*.*

  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create ${{ github.ref_name }} assets/*
          --repo ${{ github.repository }}
          --title "C# Fundamentals ${{ github.ref_name }}"
          --notes "Download the archive for your system, extract it and run BattleTower, Games, Fundamentals or DataStructures.Demo from a terminal. No installation needed. On macOS, the first time, right-click the file and choose Open (the apps are not signed)."
          --generate-notes
